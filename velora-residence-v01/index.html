(() => {
 'use strict';
 if(window.__standaloneAnalyticsMounted||!window.OfferAnalytics)return;

 window.offerAnalyticsEvent=(name,extra={})=>window.OfferAnalytics.event(name,{project_id:settings.projectId,...extra});
 document.addEventListener('click',event=>{
   const b=event.target.closest('[data-unit]');
   if(b&&b.dataset.unit!==current()) {window.OfferAnalytics.unit(b.dataset.unit);window.OfferAnalytics.event('unit_select',{project_id:settings.projectId,unit_id:b.dataset.unit,section_id:'apartments',action:'select'});}

 },true);
