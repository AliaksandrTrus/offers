    if(p.extra){const extra=el('p','handover-fee');content(extra,p.extra);node.append(extra);}
    if(p.schedule?.length){const details=el('details','schedule');details.open=scheduleOpen;details.addEventListener('toggle',()=>{scheduleOpen=details.open;});const summary=el('summary'), labels=el('span');labels.append(el('strong','',t('full')),el('small','',t('fullSub')));summary.append(labels);details.append(summary);
      const container=el('div','schedule-content'), table=el('table','schedule-table'), caption=el('caption','sr-only',t('schedule')+' · '+local(unit.title));caption.id='schedule-caption';table.append(caption);const head=el('thead'), tr=el('tr');for(const text of [t('date'),t('share'),t('amount')+' '+currency]){const th=el('th','',text);th.scope='col';tr.append(th);}head.append(tr);table.append(head);
      const body=el('tbody');for(const row of p.schedule){const tr=el('tr'),date=el('td',row.note?'monthly-cell':'',local(row.label));if(local(row.note))date.append(el('small','',local(row.note)));const share=el('td','',local(row.share)),value=el('td','num');if(local(row.prefix))value.append(local(row.prefix)+' ');if(isMoney(row.amount))value.append(amount(row.amount,false));if(local(row.suffix))value.append(' '+local(row.suffix));tr.append(date,share,value);body.append(tr);}table.append(body);container.append(table);details.append(container);node.append(details);
    }
    if(local(p.terms))node.append(el('p','terms',local(p.terms)));return node;
  }
  function renderUnit() {scheduleOpen=document.querySelector('details.schedule')?.open ?? scheduleOpen;document.getElementById('apartments').replaceWith(units());document.getElementById('payments').replaceWith(payments());}
  function map() {

    const node=el('section','location-card bottom-location');node.id='location';node.setAttribute('aria-labelledby','location-title');const head=el('div','map-head'), title=el('h2','',t('location'));title.id='location-title';const link=el('a','map-link',(language==='ru'?'Открыть в Google Maps':'Open in Google Maps')+' ');link.href=m.link;link.target='_blank';link.rel='noopener noreferrer';const arrow=el('span','','↗');arrow.setAttribute('aria-hidden','true');link.append(arrow);head.append(title,link);
    const frame=el('div','map-frame'), iframe=el('iframe'), url=mapURL(m.embedUrl);url.searchParams.set('hl',language);iframe.title=local(m.title)||t('location');iframe.src=url.href;iframe.loading='eager';iframe.allowFullscreen=true;iframe.referrerPolicy='no-referrer-when-downgrade';frame.append(iframe);node.append(head,frame);return node;
  }
  function render() {

    document.documentElement.lang=language;document.title=data.project.name+' · '+t('apartments');
    main.replaceChildren(header());const overview=el('div','overview-grid'), copy=about();overview.append(gallery(),copy);if(copy.hidden)overview.style.gridTemplateColumns='1fr';main.append(overview,units(),payments());const location=map();if(location)main.append(location);
    for(const [id,key] of [['zoom-out','zoomOut'],['zoom-in','zoomIn'],['zoom-reset','fit'],['viewer-close','close'],['viewer-prev','previous'],['viewer-next','next']])document.getElementById(id).setAttribute('aria-label',t(key));document.getElementById('viewer-title').textContent=t('image');
  }
  const viewer=document.getElementById('viewer'), viewerImage=document.getElementById('viewer-image'), viewport=document.getElementById('viewer-viewport'), zoomIn=document.getElementById('zoom-in'),zoomOut=document.getElementById('zoom-out'),reset=document.getElementById('zoom-reset');
  const viewerPrevious=document.getElementById('viewer-prev'),viewerNext=document.getElementById('viewer-next'),viewerCounter=document.getElementById('viewer-counter');
  let zoom=1,baseWidth=1,lastOpener=null,viewerGroup='single',photoClickBlockedUntil=0;
  function updateZoom(){

    zoomOut.disabled=zoom<=1;zoomIn.disabled=zoom>=4;
    viewport.classList.toggle('is-zoomed',zoom>1);
  }
  function fitImage(){
    if(!viewer.open||!viewerImage.complete||!viewerImage.naturalWidth)return;
    const padding=window.innerWidth<=760?28:48;
    const width=Math.max(1,viewport.clientWidth-padding),height=Math.max(1,viewport.clientHeight-padding);

  }
  function setViewerImage(src,caption){

  function moveViewerPhoto(direction){

  function openImage(opener){

    const canNavigate=viewerGroup==='gallery'&&data.gallery.length>1;
    viewerPrevious.hidden=viewerNext.hidden=!canNavigate;viewerCounter.hidden=viewerGroup!=='gallery';
    viewer.showModal();document.body.classList.add('viewer-open');

  // One primary pointer; vertical scrolling / pinch cancels a photo swipe.
  // At zoom > 1 the same motion pans, never advances the photo.
  function bindImageGestures(surface,getMode,navigate,isMainPhoto=false){
    let gesture=null;
    const blockClick=()=>{if(isMainPhoto)photoClickBlockedUntil=performance.now()+500;};
    const clear=()=>{
      if(gesture&&surface.hasPointerCapture?.(gesture.id))surface.releasePointerCapture(gesture.id);

        surface.scrollLeft=gesture.left-gesture.dx;surface.scrollTop=gesture.top-gesture.dy;

      if(!gesture||event.pointerId!==gesture.id)return;

  viewerImage.addEventListener('load',fitImage);
  zoomIn.addEventListener('click',()=>{zoom=Math.min(4,zoom+.5);updateZoom();});
  zoomOut.addEventListener('click',()=>{zoom=Math.max(1,zoom-.5);updateZoom();});reset.addEventListener('click',fitImage);

    document.body.classList.remove('viewer-open');viewport.classList.remove('is-panning');

  });
  viewer.addEventListener('click',event=>{if(event.target===viewer){const r=viewer.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)viewer.close();}});
  window.addEventListener('resize',()=>{if(viewer.open)fitImage();});
  render();
})();
